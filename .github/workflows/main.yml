name: Build Alnasih App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup Project Structure
        run: |
          mkdir -p temp_lib
          cp -r lib/* temp_lib/ 2>/dev/null || true
          rm -f pubspec.yaml pubspec.lock
          flutter create --org com.alnasih --project-name alnasih_mesh .
          cp -r temp_lib/* lib/ 2>/dev/null || true
          rm -rf temp_lib
      - name: Fix Android SDK & Permissions
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts 2>/dev/null || true
      - name: Install Packages
        run: flutter pub add shared_preferences uuid flutter_blue_plus
      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: Alnasih-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk



