name: Build Clean App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Clean Project
        run: |
          rm -rf * .gitignore .metadata
          flutter create --org com.alnasih --project-name alnasih_mesh .
      - name: Add Bluetooth & Storage
        run: flutter pub add shared_preferences uuid flutter_blue_plus
      - name: Fix Android SDK
        run: |
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/flutter.minSdkVersion/21/g' {} +
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Alnasih-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk



