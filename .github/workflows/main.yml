name: Build Alnasih2 (Android & iOS)
on: [push, workflow_dispatch]

jobs:
  build_android:
    name: بناء نسخة الأندرويد (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project
        run: |
          rm -rf * .gitignore .metadata
          flutter create --org com.alnasih --project-name alnasih_mesh .

      - name: Add Packages
        run: |
          flutter pub add shared_preferences
          flutter pub add flutter_localizations --sdk=flutter

      - name: Set App Name
        run: sed -i 's/android:label="alnasih_mesh"/android:label="الناصح 2"/g' android/app/src/main/AndroidManifest.xml

      - name: Write App Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            runApp(const AlnasihMeshApp());
          }

          class AlnasihMeshApp extends StatelessWidget {
            const AlnasihMeshApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'الناصح 2',
                debugShowCheckedModeBanner: false,
                locale: const Locale('ar'),
                supportedLocales: const [Locale('ar')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0D1117),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFFF3B30),
                    secondary: Color(0xFFFF9500),
                  ),
                ),
                home: const MeshHomeScreen(),
              );
            }
          }

          class MeshHomeScreen extends StatefulWidget {
            const MeshHomeScreen({super.key});

            @override
            State<MeshHomeScreen> createState() => _MeshHomeScreenState();
          }

          class _MeshHomeScreenState extends State<MeshHomeScreen> {
            final TextEditingController _controller = TextEditingController();
            List<Map<String, dynamic>> messages = [];
            bool isScanning = false;

            final List<String> quickAlerts = [
              '🆘 نداء استغاثة عاجل',
              '🏥 نحتاج مساعدة طبية',
              '✅ نحن في مكان آمن',
              '💧 نحتاج مياه وإمدادات',
            ];

            @override
            void initState() {
              super.initState();
              _loadMessages();
            }

            Future<void> _loadMessages() async {
              final prefs = await SharedPreferences.getInstance();
              final String? data = prefs.getString('saved_msgs_v2');
              if (data != null) {
                setState(() {
                  messages = List<Map<String, dynamic>>.from(jsonDecode(data));
                });
              }
            }

            Future<void> _saveMessages() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('saved_msgs_v2', jsonEncode(messages));
            }

            void _sendMessage([String? customText]) {
              final textToSend = customText ?? _controller.text.trim();
              if (textToSend.isEmpty) return;

              final now = TimeOfDay.now();
              final timeStr = "${now.hour}:${now.minute.toString().padLeft(2, '0')}";

              setState(() {
                messages.insert(0, {
                  'text': textToSend,
                  'hops': 1,
                  'time': timeStr,
                  'isAlert': customText != null,
                });
                if (customText == null) _controller.clear();
              });
              _saveMessages();
            }

            void _toggleRadar() {
              setState(() => isScanning = !isScanning);
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(
                    isScanning
                        ? '📡 تم تفعيل رادار البحث عن أجهزة الناصح القريبة...'
                        : '⏸️ تم إيقاف المسح مؤقتاً',
                    style: const TextStyle(color: Colors.white),
                  ),
                  backgroundColor: const Color(0xFF1F2937),
                  duration: const Duration(seconds: 2),
                ),
              );
            }

            void _clearAll() async {
              setState(() => messages.clear());
              final prefs = await SharedPreferences.getInstance();
              await prefs.remove('saved_msgs_v2');
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  elevation: 0,
                  backgroundColor: const Color(0xFF161B22),
                  title: const Row(
                    children: [
                      Icon(Icons.podcasts, color: Color(0xFFFF3B30), size: 26),
                      SizedBox(width: 10),
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text('الناصح 2', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                          Text('شبكة الطوارئ المحلية • Mesh', style: TextStyle(fontSize: 11, color: Colors.grey)),
                        ],
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.delete_sweep_outlined, color: Colors.grey),
                      onPressed: _clearAll,
                      tooltip: 'مسح السجل',
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Container(
                      margin: const EdgeInsets.all(12),
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [Color(0xFF1F242D), Color(0xFF161B22)],
                          begin: Alignment.topRight,
                          end: Alignment.bottomLeft,
                        ),
                        borderRadius: BorderRadius.circular(16),
                        border: Border.all(
                          color: isScanning ? const Color(0xFFFF3B30) : Colors.white12,
                          width: 1.5,
                        ),
                      ),
                      child: Row(
                        children: [
                          Container(
                            padding: const EdgeInsets.all(12),
                            decoration: BoxDecoration(
                              color: const Color(0xFFFF3B30).withValues(alpha: 0.15),
                              shape: BoxShape.circle,
                            ),
                            child: Icon(
                              isScanning ? Icons.radar : Icons.cell_tower,
                              color: const Color(0xFFFF3B30),
                              size: 28,
                            ),
                          ),
                          const SizedBox(width: 14),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(
                                  isScanning ? 'جاري مسح النطاق المحيط...' : 'الشبكة المحلية نشطة',
                                  style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15),
                                ),
                                const SizedBox(height: 4),
                                const Text(
                                  'يعمل بدون إنترنت أو شريحة اتصال',
                                  style: TextStyle(color: Colors.greenAccent, fontSize: 12),
                                ),
                              ],
                            ),
                          ),
                          ElevatedButton(
                            onPressed: _toggleRadar,
                            style: ElevatedButton.styleFrom(
                              backgroundColor: isScanning ? Colors.grey : const Color(0xFFFF3B30),
                              foregroundColor: Colors.white,
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                            ),
                            child: Text(isScanning ? 'إيقاف' : 'فحص'),
                          ),
                        ],
                      ),
                    ),
                    SizedBox(
                      height: 42,
                      child: ListView.builder(
                        scrollDirection: Axis.horizontal,
                        padding: const EdgeInsets.symmetric(horizontal: 10),
                        itemCount: quickAlerts.length,
                        itemBuilder: (context, index) {
                          return Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 4),
                            child: ActionChip(
                              backgroundColor: const Color(0xFF21262D),
                              side: const BorderSide(color: Colors.white12),



