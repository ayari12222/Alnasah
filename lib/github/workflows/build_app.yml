name: Build Alnasih Mesh App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Initialize Flutter Project Structure
        run: flutter create --org com.alnasih --project-name alnasih_mesh .
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Alnasih-Mesh-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
